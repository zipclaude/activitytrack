name: CI

on:
  push:
    branches: [main, beta]
    # a version tag (v0.2.0) also publishes the signed release (job release)
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the checksum of gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :core:domain:test :app:testDebugUnitTest 2>&1 | tee -a build.log; exit "${PIPESTATUS[0]}"

      # Instrumented tests need a device; CI only keeps them compiling.
      - name: Compile instrumented tests
        run: ./gradlew :core:data:assembleDebugAndroidTest 2>&1 | tee -a build.log; exit "${PIPESTATUS[0]}"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug 2>&1 | tee -a build.log; exit "${PIPESTATUS[0]}"

      # Surface compiler and Gradle errors as annotations, readable through the
      # REST API (check-runs/<id>/annotations) without downloading the raw log.
      - name: Report build errors
        if: failure()
        run: |
          {
            grep -E '^e: |error:|FAILED$' build.log | grep -v '^> Task' || true
            grep -A 25 '^\* What went wrong' build.log \
              | grep -vE '^\* Try:|^> Run with|^> Get more help|^$' || true
          } | head -n 80 > errors.txt
          split -l 4 errors.txt chunk.
          for f in chunk.*; do
            [ -s "$f" ] || continue
            msg=$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build::${msg}"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Signed release APK on GitHub Releases for every version tag (owner,
  # 2026-10-18): one fixed key from the repository secrets, so a release
  # updates the installed app; debug builds stay the adb test app.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags and history: the manual check compares with the previous tag

      # Owner, 2026-10-19: before every release check that the manual was
      # updated; the PDFs (quick start and manual, it/en) go with the APK.
      - name: Manual check
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-manual.sh "$TAG"

      - name: Manual tools
        run: sudo apt-get update -q && sudo apt-get install -y -q pandoc graphviz

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Signed release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          export RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_STORE_FILE"
          ./gradlew :app:assembleRelease \
            -Pactivitytrack.versionName="${TAG#v}" \
            -Pactivitytrack.versionCode="${{ github.run_number }}"
          rm -f "$RELEASE_STORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "ActivityTrack-${TAG#v}.apk"

      - name: Manual PDF
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/build-manual.sh "${TAG#v}"

      - name: Manual PDF check
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf"
          "$RUNNER_TEMP/pdf/bin/pip" install -q pymupdf
          "$RUNNER_TEMP/pdf/bin/python" scripts/check-pdf.py build/manual/*.pdf

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "ActivityTrack-${TAG#v}.apk" build/manual/*.pdf --title "ActivityTrack ${TAG#v}" --generate-notes
