name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the checksum of gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :core:domain:test :app:testDebugUnitTest 2>&1 | tee -a build.log; exit "${PIPESTATUS[0]}"

      # Instrumented tests need a device; CI only keeps them compiling.
      - name: Compile instrumented tests
        run: ./gradlew :core:data:assembleDebugAndroidTest 2>&1 | tee -a build.log; exit "${PIPESTATUS[0]}"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug 2>&1 | tee -a build.log; exit "${PIPESTATUS[0]}"

      # Surface compiler and Gradle errors as annotations, readable through the
      # REST API (check-runs/<id>/annotations) without downloading the raw log.
      - name: Report build errors
        if: failure()
        run: |
          {
            grep -E '^e: |error:|FAILED$' build.log | grep -v '^> Task' || true
            grep -A 25 '^\* What went wrong' build.log \
              | grep -vE '^\* Try:|^> Run with|^> Get more help|^$' || true
          } | head -n 80 > errors.txt
          split -l 4 errors.txt chunk.
          for f in chunk.*; do
            [ -s "$f" ] || continue
            msg=$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build::${msg}"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
